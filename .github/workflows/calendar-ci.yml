name: Season CI

on:
  pull_request:
    paths: ["calendar/**", ".github/workflows/calendar-ci.yml"]
  push:
    branches: [main]
    paths: ["calendar/**", ".github/workflows/calendar-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar
    env:
      DATABASE_URL: "file:./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calendar/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar
    env:
      DATABASE_URL: "file:./e2e.db"
      E2E_TEST_ROUTES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calendar/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npx next dev -p 3000 > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 2; done
          cat dev.log; exit 1
      - name: Playwright
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: calendar/test-results
